name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Примусово ставимо джерело Pages = "workflow" (GitHub Actions).
      # configure-pages не перемикає вже увімкнене на "branch" джерело,
      # тому робимо прямий виклик Pages API — це вимикає автоматичний
      # Jekyll-білд (pages-build-deployment), який конкурував за деплой.
      - name: Force Pages source = GitHub Actions
        continue-on-error: true
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $code"; cat /tmp/pages.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prerender)
        run: npx ng build --base-href "/Vasyl-Potapchuk---Svoyi-u-Lvovi/"

      - name: SPA fallback (404.html)
        run: cp dist/svoyi-u-lvovi/browser/index.html dist/svoyi-u-lvovi/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/svoyi-u-lvovi/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
