<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="Свої у Львові — на головну" (click)="closeMenu()">
      <app-logo [emblemSize]="38" />
    </a>
    <nav class="header-nav" aria-label="Основна навігація">
      @for (item of navItems; track item.href) {
        <a [href]="item.href">{{ item.label }}</a>
      }
    </nav>
    <a class="header-phone" [href]="contacts.phoneHref">
      <i class="pi pi-phone" aria-hidden="true"></i>
      <span>{{ contacts.phone }}</span>
    </a>
    <button
      type="button"
      class="header-burger"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Меню"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Мобільне меню -->
  <nav
    id="mobile-menu"
    class="mobile-menu"
    [class.is-open]="menuOpen()"
    aria-label="Мобільна навігація"
  >
    <div class="container">
      @for (item of navItems; track item.href) {
        <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <a class="mobile-menu-phone" [href]="contacts.phoneHref" (click)="closeMenu()">
        <i class="pi pi-phone" aria-hidden="true"></i> {{ contacts.phone }}
      </a>
    </div>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <app-logo [emblemSize]="40" />
      <p>{{ footer.tagline }}</p>
    </div>
    <nav class="footer-nav" aria-label="Навігація у футері">
      <a href="#services">Послуги</a>
      <a href="#why">Чому ми</a>
      <a href="#reviews">Відгуки</a>
      <a href="#contacts">Контакти</a>
    </nav>
    <div class="footer-contact">
      <a class="footer-phone" [href]="contacts.phoneHref">{{ contacts.phone }}</a>
      <span>{{ contacts.hours }}</span>
    </div>
  </div>
  <div class="container footer-note">{{ footer.note }}</div>
</footer>
