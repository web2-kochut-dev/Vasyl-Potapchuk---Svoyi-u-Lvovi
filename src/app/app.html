<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <i class="pi pi-shield brand-icon" aria-hidden="true"></i>
      <span class="brand-name">{{ footer.brand }}</span>
    </a>
    <a class="header-phone" [href]="contacts.phoneHref">
      <i class="pi pi-phone" aria-hidden="true"></i>
      {{ contacts.phone }}
    </a>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <strong>{{ footer.brand }}</strong> — {{ footer.tagline }}
    <p>{{ footer.note }}</p>
  </div>
</footer>
