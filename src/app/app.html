<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="Свої у Львові — на головну">
      <app-logo [emblemSize]="38" />
    </a>
    <a class="header-phone" [href]="contacts.phoneHref">
      <i class="pi pi-phone" aria-hidden="true"></i>
      {{ contacts.phone }}
    </a>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <strong>{{ footer.brand }}</strong> — {{ footer.tagline }}
    <p>{{ footer.note }}</p>
  </div>
</footer>
